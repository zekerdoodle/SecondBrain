<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diet Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/file/05_App_Data/_shared/theme.css">
<style>
/* === App Variables === */
:root {
  --accent-light: color-mix(in srgb, var(--accent) 8%, var(--bg));
  --accent-glow: color-mix(in srgb, var(--accent) 12%, transparent);
  --success-light: color-mix(in srgb, var(--success) 8%, transparent);
  --warning-light: color-mix(in srgb, var(--warning) 8%, transparent);
}

body { min-height: 100vh; overflow-x: hidden; padding-bottom: 70px; }

/* === TAB NAV (bottom) === */
.tab-bar {
  display: flex; background: var(--bg-deep); border-top: 1px solid var(--border);
  position: fixed; bottom: 0; left: 0; right: 0; z-index: var(--z-sticky);
}
.tab-btn {
  flex: 1; padding: 10px 4px 8px; text-align: center; cursor: pointer;
  color: var(--text-muted); font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
  border: none; background: none; border-top: 2px solid transparent;
  transition: color var(--ease-normal), border-color var(--ease-normal);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: inherit; -webkit-tap-highlight-color: transparent;
}
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--accent); border-top-color: var(--accent); }
.tab-icon { font-size: 18px; }

/* === MAIN CONTENT === */
main { padding: var(--sp-lg); max-width: 600px; margin: 0 auto; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* === COMMON === */
.card {
  background: var(--bg-surface); border-radius: var(--radius-xl);
  padding: var(--sp-lg); margin-bottom: var(--sp-md);
  border: 1px solid var(--border);
}
.card-header { font-size: var(--font-size-md); font-weight: 600; margin-bottom: var(--sp-sm); color: var(--text); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm);
  border: none; border-radius: var(--radius-lg); padding: 12px 20px; cursor: pointer;
  font-weight: 600; font-size: var(--font-size-md); font-family: inherit;
  transition: background var(--ease-normal), opacity var(--ease-normal), transform 0.1s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-deep); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--border); }
.btn-success { background: var(--success); color: var(--bg); }
.btn-success:hover:not(:disabled) { opacity: 0.9; }
.btn-danger { background: var(--danger); color: var(--bg); }
.btn-danger:hover:not(:disabled) { opacity: 0.9; }
.btn-large { padding: 14px 28px; font-size: var(--font-size-lg); width: 100%; border-radius: var(--radius-xl); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost { background: none; color: var(--text-muted); padding: var(--sp-sm) var(--sp-md); font-size: var(--font-size-sm); }
.btn-ghost:hover { color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: var(--font-size-sm); border-radius: var(--radius-md); }

input, textarea, select {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: var(--sp-md) var(--sp-lg); border-radius: var(--radius-lg); font-size: var(--font-size-md);
  width: 100%; font-family: inherit; outline: none; -webkit-appearance: none;
  transition: border-color var(--ease-normal);
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
textarea { resize: vertical; min-height: 60px; }

/* === GREETING === */
.greeting { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.greeting-sub { font-size: var(--font-size-md); color: var(--text-muted); margin-bottom: var(--sp-2xl); }

/* === WEIGHT INPUT === */
.weight-input-wrap { margin-bottom: var(--sp-lg); text-align: center; }
.weight-input-wrap label { font-size: var(--font-size-base); color: var(--text-muted); display: block; margin-bottom: var(--sp-sm); }
.weight-big { font-size: 28px; font-weight: 700; text-align: center; padding: var(--sp-lg); max-width: 200px; margin: 0 auto; }
.yesterday-ref { font-size: var(--font-size-sm); color: var(--text-muted); margin-top: var(--sp-sm); }

/* === MACRO BAR (daily totals) === */
.macro-bar {
  display: flex; gap: var(--sp-lg); padding: var(--sp-md) var(--sp-lg); background: var(--bg-surface);
  border-radius: var(--radius-xl); margin-bottom: var(--sp-lg); align-items: center;
  border: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
}
.macro-item { text-align: center; flex: 1; }
.macro-current { font-size: var(--font-size-xl); font-weight: 700; }
.macro-target { font-size: var(--font-size-xs); color: var(--text-muted); }
.macro-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.macro-progress { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.macro-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

/* === SLOT CARDS === */
.slot-card {
  background: var(--bg-surface); border-radius: var(--radius-xl);
  margin-bottom: var(--sp-md); border: 1px solid var(--border);
  overflow: hidden; transition: border-color var(--ease-normal);
}
.slot-card.logged { border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
.slot-header {
  padding: 14px var(--sp-lg); cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.slot-header:hover { background: var(--accent-light); }
.slot-info { flex: 1; }
.slot-name { font-size: var(--font-size-md); font-weight: 600; }
.slot-time { font-size: var(--font-size-xs); color: var(--text-muted); margin-left: var(--sp-sm); }
.slot-target { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 2px; }
.slot-status { font-size: var(--font-size-sm); color: var(--text-muted); text-align: right; }
.slot-logged-macros { font-size: var(--font-size-sm); color: var(--success); font-weight: 600; }
.slot-check { color: var(--success); font-weight: 700; margin-right: var(--sp-sm); font-size: 16px; }

/* Expanded slot body */
.slot-body { display: none; padding: 0 var(--sp-lg) var(--sp-lg); }
.slot-card.expanded .slot-body { display: block; }

/* Logged meal display inside slot */
.logged-meal-display {
  padding: var(--sp-md); background: var(--bg-deep); border-radius: var(--radius-lg);
  margin-bottom: var(--sp-sm);
}
.logged-meal-items { font-size: var(--font-size-sm); color: var(--text-secondary); }
.logged-meal-items div { padding: 2px 0; display: flex; justify-content: space-between; }
.logged-meal-totals {
  display: flex; justify-content: space-between; margin-top: var(--sp-sm);
  padding-top: var(--sp-sm); border-top: 1px solid var(--border);
  font-size: var(--font-size-sm); font-weight: 600;
}

/* Rating buttons */
.rating-row { display: flex; gap: var(--sp-sm); align-items: center; margin-top: var(--sp-sm); }
.rating-btn {
  padding: 4px 10px; border-radius: var(--radius-full); border: 1px solid var(--border);
  background: transparent; cursor: pointer; font-size: 16px; transition: all var(--ease-fast);
  -webkit-tap-highlight-color: transparent;
}
.rating-btn:hover { background: var(--bg-deep); }
.rating-btn.active-up { background: var(--success-light); border-color: var(--success); }
.rating-btn.active-down { background: color-mix(in srgb, var(--warning) 12%, transparent); border-color: var(--warning); }
.rating-note-input {
  margin-top: var(--sp-sm); font-size: var(--font-size-sm);
  padding: var(--sp-sm) var(--sp-md); background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text); width: 100%; font-family: inherit; outline: none;
}
.rating-note-input:focus { border-color: var(--accent); }

/* Pin button */
.pin-btn {
  padding: 4px 10px; border-radius: var(--radius-full); border: 1px solid var(--border);
  background: transparent; cursor: pointer; font-size: 14px; transition: all var(--ease-fast);
  -webkit-tap-highlight-color: transparent; margin-left: auto;
}
.pin-btn:hover { background: var(--bg-deep); }
.pin-btn.pinned { background: var(--accent-glow); border-color: var(--accent); }

/* Meal action row */
.meal-actions { display: flex; gap: var(--sp-sm); align-items: center; margin-top: var(--sp-sm); flex-wrap: wrap; }

/* === MODE TABS (Pre-made / Build / Describe) === */
.mode-tabs {
  display: flex; gap: 2px; background: var(--bg-deep); border-radius: var(--radius-lg);
  padding: 2px; margin-bottom: var(--sp-md);
}
.mode-tab {
  flex: 1; padding: 8px 4px; text-align: center; border-radius: var(--radius-md);
  border: none; background: transparent; color: var(--text-muted); cursor: pointer;
  font-size: var(--font-size-sm); font-weight: 600; font-family: inherit;
  transition: all var(--ease-fast); -webkit-tap-highlight-color: transparent;
}
.mode-tab.active { background: var(--bg-surface); color: var(--accent); }
.mode-tab:hover:not(.active) { color: var(--text-secondary); }
.mode-content { display: none; }
.mode-content.active { display: block; }

/* === PRE-MADE MEALS === */
.premade-card {
  background: var(--bg-deep); border-radius: var(--radius-lg); padding: var(--sp-md);
  margin-bottom: var(--sp-sm); cursor: pointer; transition: all var(--ease-fast);
  border: 1px solid transparent; -webkit-tap-highlight-color: transparent;
}
.premade-card:hover { border-color: var(--border); }
.premade-card:active { transform: scale(0.98); }
.premade-name { font-size: var(--font-size-md); font-weight: 600; }
.premade-macros { font-size: var(--font-size-sm); color: var(--text-muted); margin-top: 2px; }

/* Pinned meal banner */
.pinned-banner {
  background: var(--accent-glow); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  border-radius: var(--radius-lg); padding: var(--sp-md); margin-bottom: var(--sp-md);
}
.pinned-banner-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--accent); margin-bottom: var(--sp-sm); }
.pinned-banner-actions { display: flex; gap: var(--sp-sm); margin-top: var(--sp-sm); }

/* === BUILD MODE === */
.build-running-total {
  background: var(--bg-deep); border-radius: var(--radius-lg); padding: var(--sp-md);
  margin-bottom: var(--sp-md); display: flex; justify-content: space-between; align-items: center;
  font-size: var(--font-size-md); font-weight: 600; position: sticky; top: 0; z-index: 5;
  border: 1px solid var(--border);
}
.build-items { margin-bottom: var(--sp-md); }
.build-item {
  display: flex; align-items: center; gap: var(--sp-sm); padding: 8px var(--sp-md);
  background: var(--bg-surface); border-radius: var(--radius-md); margin-bottom: 4px;
  border: 1px solid var(--border);
}
.build-item-name { flex: 1; font-size: var(--font-size-sm); font-weight: 500; }
.build-item-qty {
  width: 56px; padding: 4px 6px; text-align: center; font-size: var(--font-size-md);
  font-weight: 700; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text); font-family: inherit; outline: none;
}
.build-item-qty:focus { border-color: var(--accent); }
.build-item-unit { font-size: var(--font-size-xs); color: var(--text-muted); min-width: 32px; }
.build-item-cals { font-size: var(--font-size-xs); color: var(--text-muted); min-width: 50px; text-align: right; }
.build-item-remove {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  font-size: 16px; padding: 2px 4px; -webkit-tap-highlight-color: transparent;
}
.build-item-remove:hover { color: var(--danger); }

/* Ingredient picker (collapsible sections) */
.ing-section { margin-bottom: var(--sp-sm); }
.ing-section-header {
  display: flex; align-items: center; gap: var(--sp-sm); padding: 8px var(--sp-md);
  background: var(--bg-deep); border-radius: var(--radius-md); cursor: pointer;
  font-size: var(--font-size-sm); font-weight: 600; color: var(--text-secondary);
  border: 1px solid var(--border); -webkit-tap-highlight-color: transparent;
  transition: background var(--ease-fast);
}
.ing-section-header:hover { background: var(--border); }
.ing-section-header .arrow { transition: transform var(--ease-fast); font-size: 10px; }
.ing-section.open .ing-section-header .arrow { transform: rotate(90deg); }
.ing-section-body { display: none; padding: 4px 0; }
.ing-section.open .ing-section-body { display: block; }
.ing-item {
  display: flex; align-items: center; padding: 8px var(--sp-md); cursor: pointer;
  border-radius: var(--radius-md); transition: background var(--ease-fast);
  -webkit-tap-highlight-color: transparent;
}
.ing-item:hover { background: var(--accent-light); }
.ing-item:active { background: var(--accent-glow); }
.ing-item-name { flex: 1; font-size: var(--font-size-sm); }
.ing-item-meta { font-size: var(--font-size-xs); color: var(--text-muted); }
.ing-item-add { color: var(--accent); font-weight: 700; font-size: 18px; margin-left: var(--sp-sm); }

/* === DESCRIBE MODE === */
.describe-area { margin-top: var(--sp-sm); }
.describe-loading {
  display: flex; align-items: center; gap: var(--sp-md); padding: var(--sp-lg);
  background: var(--accent-glow); border-radius: var(--radius-lg);
  color: var(--accent); font-size: var(--font-size-base);
  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.5s ease-in-out infinite; }

/* === END OF DAY === */
.feel-row { display: flex; gap: var(--sp-sm); margin: var(--sp-md) 0; }
.feel-btn {
  flex: 1; padding: 14px 4px; border-radius: var(--radius-lg); border: 2px solid var(--border);
  background: var(--bg-surface); color: var(--text); cursor: pointer; text-align: center;
  font-size: var(--font-size-sm); font-weight: 600; transition: all var(--ease-fast);
  -webkit-tap-highlight-color: transparent;
}
.feel-btn:hover { border-color: var(--border-hover); }
.feel-btn.active { border-color: var(--accent); background: var(--accent-glow); }
.feel-num { font-size: 20px; display: block; margin-bottom: 2px; }

/* === SUMMARY === */
.summary-card { text-align: center; padding: var(--sp-2xl) var(--sp-lg); }
.summary-title { font-size: var(--font-size-xl); font-weight: 700; margin-bottom: var(--sp-lg); }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-md); margin-bottom: var(--sp-lg); }
.summary-item { background: var(--bg-surface); border-radius: var(--radius-lg); padding: var(--sp-md); border: 1px solid var(--border); }
.summary-value { font-size: 20px; font-weight: 700; color: var(--accent); }
.summary-label { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 2px; }

/* === CHART === */
.chart-container { position: relative; width: 100%; margin-bottom: var(--sp-lg); }
.chart-container canvas { width: 100% !important; }

/* === STATS === */
.stat-row { display: flex; gap: var(--sp-md); margin-bottom: var(--sp-md); flex-wrap: wrap; }
.stat-badge {
  flex: 1; min-width: 80px; background: var(--bg-surface); border-radius: var(--radius-lg);
  padding: var(--sp-md); text-align: center; border: 1px solid var(--border);
}
.stat-value { font-size: var(--font-size-2xl); font-weight: 700; color: var(--accent); }
.stat-label { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 2px; }

/* === ACCORDION === */
.accordion { margin-bottom: var(--sp-sm); }
.accordion-header {
  background: var(--bg-surface); border-radius: var(--radius-lg); padding: var(--sp-md) var(--sp-lg);
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--border); font-size: var(--font-size-base); font-weight: 600;
  transition: all var(--ease-fast); -webkit-tap-highlight-color: transparent;
}
.accordion-header:hover { background: var(--bg-deep); }
.accordion-body {
  display: none; padding: var(--sp-md) var(--sp-lg); background: var(--bg-deep);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  border: 1px solid var(--border); border-top: none; font-size: var(--font-size-base);
}
.accordion-body.open { display: block; }
.accordion-header.open { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }

/* === HISTORY === */
.history-day {
  background: var(--bg-surface); border-radius: var(--radius-lg); padding: 14px var(--sp-lg);
  margin-bottom: var(--sp-sm); border: 1px solid var(--border); cursor: pointer;
  transition: all var(--ease-fast); -webkit-tap-highlight-color: transparent;
}
.history-day:hover { background: var(--bg-deep); }
.history-day-header { display: flex; justify-content: space-between; align-items: center; }
.history-day-date { font-size: var(--font-size-md); font-weight: 600; }
.history-day-weight { font-size: var(--font-size-base); color: var(--accent); }
.history-day-macros { font-size: var(--font-size-sm); color: var(--text-muted); margin-top: 4px; }
.history-day-detail {
  display: none; margin-top: var(--sp-md); padding-top: var(--sp-md);
  border-top: 1px solid var(--border); font-size: var(--font-size-sm); color: var(--text-secondary);
}
.history-day-detail.open { display: block; }
.history-meal-line { padding: 3px 0; display: flex; justify-content: space-between; }

/* === MEALS TAB: Ingredient Database === */
.db-section { margin-bottom: var(--sp-lg); }
.db-section-header {
  font-size: var(--font-size-md); font-weight: 700; margin-bottom: var(--sp-sm);
  color: var(--text); text-transform: capitalize;
}
.db-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px var(--sp-md); background: var(--bg-surface); border-radius: var(--radius-md);
  margin-bottom: 4px; border: 1px solid var(--border); font-size: var(--font-size-sm);
}
.db-item-name { font-weight: 500; }
.db-item-macros { color: var(--text-muted); white-space: nowrap; }

/* Premade browse */
.browse-slot { margin-bottom: var(--sp-lg); }
.browse-slot-header { font-size: var(--font-size-md); font-weight: 700; margin-bottom: 4px; color: var(--text); }
.browse-slot-sub { font-size: var(--font-size-sm); color: var(--text-muted); margin-bottom: var(--sp-md); }
.browse-meal {
  background: var(--bg-surface); border-radius: var(--radius-lg); padding: var(--sp-md) var(--sp-lg);
  margin-bottom: 6px; border: 1px solid var(--border); cursor: pointer; transition: all var(--ease-fast);
}
.browse-meal:hover { background: var(--bg-deep); }
.browse-meal-header { display: flex; justify-content: space-between; align-items: center; }
.browse-meal-name { font-size: var(--font-size-base); font-weight: 600; }
.browse-meal-macros { font-size: var(--font-size-sm); color: var(--text-secondary); }
.browse-meal-items {
  display: none; margin-top: var(--sp-sm); padding-top: var(--sp-sm);
  border-top: 1px solid var(--border); font-size: var(--font-size-sm); color: var(--text-muted);
}
.browse-meal-items.open { display: block; }

/* === SETTINGS === */
.settings-section { margin-bottom: 20px; }
.settings-label { font-size: var(--font-size-sm); color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.settings-value { font-size: var(--font-size-md); margin-bottom: var(--sp-md); }

/* === MODALS === */
.modal-overlay {
  display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: var(--z-modal); align-items: center; justify-content: center;
  padding: var(--sp-lg); opacity: 0; pointer-events: none; transition: opacity var(--ease-normal);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg-surface); border-radius: var(--radius-2xl); padding: 20px; width: 100%;
  max-width: 400px; border: 1px solid var(--border); max-height: 80vh; overflow-y: auto;
}
.modal-title { font-size: var(--font-size-lg); font-weight: 700; margin-bottom: var(--sp-md); }
.modal-actions { display: flex; gap: var(--sp-sm); margin-top: var(--sp-md); }
.modal-actions .btn { flex: 1; }

/* === ANIMATIONS === */
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: slideIn 0.2s ease-out; }
</style>
</head>
<body>

<main>
  <div id="tab-today" class="tab-content active"><div id="today-content"></div></div>
  <div id="tab-progress" class="tab-content"><div id="progress-content"></div></div>
  <div id="tab-meals" class="tab-content"><div id="meals-content"></div></div>
  <div id="tab-history" class="tab-content"><div id="history-content"></div></div>
  <div id="tab-settings" class="tab-content"><div id="settings-content"></div></div>
</main>

<nav class="tab-bar">
  <button class="tab-btn active" data-tab="today"><span class="tab-icon">&#9737;</span>Today</button>
  <button class="tab-btn" data-tab="progress"><span class="tab-icon">&#9650;</span>Progress</button>

// ============================================================
// HELPERS
// ============================================================
function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function nowTime() {
  const now = new Date();
  return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}

function getFood(key) {
  return foods.foods ? foods.foods[key] : null;
}

function calcItemMacros(item) {
  const f = getFood(item.food);
  if (!f) return { cal: 0, protein: 0, fat: 0, carb: 0 };
  return {
    cal: Math.round(f.cal * item.amount),
    protein: Math.round(f.protein * item.amount * 10) / 10,
    fat: Math.round(f.fat * item.amount * 10) / 10,
    carb: Math.round(f.carb * item.amount * 10) / 10
  };
}

function calcItemsTotals(items) {
  let cal = 0, protein = 0, fat = 0, carb = 0;
  for (const it of items) {
    const m = calcItemMacros(it);
    cal += m.cal; protein += m.protein; fat += m.fat; carb += m.carb;
  }
  return { cal: Math.round(cal), protein: Math.round(protein), fat: Math.round(fat), carb: Math.round(carb) };
}

function getSlotInfo(slotNum) {
  if (!mealPlan || !mealPlan.slots) return null;
  return mealPlan.slots.find(s => s.slot === slotNum) || null;
}

function getTodayData() {
  return dailyLog[todayKey] || null;
}

function ensureTodayExists() {
  if (!dailyLog[todayKey]) {
    dailyLog[todayKey] = { weight: null, weight_time: null, meals: [] };
  }
  return dailyLog[todayKey];
}

function getYesterdayWeight() {
  const dates = Object.keys(dailyLog).sort().reverse();
  for (const d of dates) {
    if (d < todayKey && dailyLog[d].weight) return dailyLog[d].weight;
  }
  return null;
}

// Get today's totals from all logged meals (handles both old and new formats)
function getTodayTotals() {
  const today = getTodayData();
  if (!today) return { cal: 0, protein: 0, fat: 0, carb: 0 };
  return getDayTotals(today);
}

// Get totals for any day (handles both old and new formats)
function getDayTotals(dayData) {
  let cal = 0, protein = 0, fat = 0, carb = 0;

  if (dayData.meals && Array.isArray(dayData.meals)) {
    for (const m of dayData.meals) {
      if (m.totals) {
        // New format
        cal += m.totals.cal || 0;
        protein += m.totals.protein || 0;
        fat += m.totals.fat || 0;
        carb += m.totals.carb || 0;
      } else if (m.option_id) {
        // Old format — try to get from old mealPlan structure
        const opt = getOldOptionById(m.option_id);
        if (opt) {
          cal += opt.total_cal || 0;
          protein += opt.total_protein || 0;
        }
      } else if (m.library_id) {
        // Old library format — resolve via legacy library
        const lib = getOldOptionById(m.library_id);
        if (lib) {
          cal += lib.total_cal || 0;
          protein += lib.total_protein || 0;
        }
      }
    }
  }

  // Old format custom meals
  if (dayData.custom_meals && Array.isArray(dayData.custom_meals)) {
    for (const cm of dayData.custom_meals) {
      cal += cm.total_cal || cm.estimated_cal || cm.cal || 0;
      protein += cm.total_protein || cm.estimated_protein || cm.protein || 0;
    }
  }

  return { cal, protein, fat, carb };
}

// Resolve old option_id or library_id to {label, total_cal, total_protein}
function getOldOptionById(id) {
  if (OLD_OPTIONS[id]) return OLD_OPTIONS[id];
  if (legacyLibrary[id]) return legacyLibrary[id];
  return null;
}

function getMealsForSlot(slotNum) {
  const today = getTodayData();
  if (!today || !today.meals) return [];
  return today.meals.filter(m => m.slot === slotNum);
}

function getLoggedSlots() {
  const today = getTodayData();
  if (!today) return new Set();
  const slots = new Set();
  if (today.meals) today.meals.forEach(m => slots.add(m.slot));
  // Old format
  if (today.custom_meals) today.custom_meals.forEach(m => slots.add(m.slot));
  return slots;
}

function getPremadeMealsForSlot(slotNum) {
  if (!mealPlan || !mealPlan.premade_meals) return [];
  return mealPlan.premade_meals[String(slotNum)] || [];
}

function getPinnedMealForSlot(slotNum) {
  return pinnedMeals[String(slotNum)] || null;
}

// ============================================================
// PERSISTENCE
// ============================================================
async function loadData() {
  const [f, mp, dl, pm, cml] = await Promise.all([
    store.read('foods.json', null),
    store.read('meal_plan.json', null),
    store.read('daily_log.json', {}),
    store.read('pinned_meals.json', {}),
    store.read('custom_meal_library.json', null)
  ]);

  // Foods: seed if missing
  if (!f || !f.foods) {
    foods = JSON.parse(JSON.stringify(SEED_FOODS));
    await store.write('foods.json', foods);
  } else {
    foods = f;
  }

  // Meal plan: seed if missing or old format, otherwise preserve coach's edits
  if (!mp || !mp.slots) {
    mealPlan = JSON.parse(JSON.stringify(SEED_MEAL_PLAN));
    await store.write('meal_plan.json', mealPlan);
  } else {
    mealPlan = mp;
  }

  dailyLog = dl || {};
  pinnedMeals = pm || {};

  // Build legacy library lookup from custom_meal_library.json
  if (cml && cml.meals) {
    for (const slotKey of Object.keys(cml.meals)) {
      for (const entry of cml.meals[slotKey]) {
        if (entry.id) {
          legacyLibrary[entry.id] = entry;
        }
      }
    }
  }
}

async function saveLog() {
  try { await store.write('daily_log.json', dailyLog); }
  catch (e) { console.error('Save failed:', e); BrainKit.toast('Failed to save', 'error'); }
}

async function saveFoods() {
  try { await store.write('foods.json', foods); }
  catch (e) { console.error('Save foods failed:', e); BrainKit.toast('Failed to save', 'error'); }
}

async function savePinnedMeals() {
  try { await store.write('pinned_meals.json', pinnedMeals); }
  catch (e) { console.error('Save pinned failed:', e); BrainKit.toast('Failed to save', 'error'); }
}

document.querySelectorAll('.tab-btn').forEach(btn => {

    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    renderTab(btn.dataset.tab);
  });
});

function checkDateChange() {
  const now = getToday();
  if (now !== todayKey) { todayKey = now; return true; }
  return false;
}

function renderTab(tab) {
  checkDateChange();
  switch(tab) {
    case 'today': renderToday(); break;
    case 'progress': renderProgress(); break;
    case 'meals': renderMeals(); break;
    case 'history': renderHistory(); break;
    case 'settings': renderSettings(); break;
  }
}

// ============================================================
// TAB: TODAY
// ============================================================
function renderToday() {
  const container = document.getElementById('today-content');
  const today = getTodayData();

  // State: No weight logged (and day doesn't exist yet or no weight)
  if (!today || (!today.weight && !today.weight_skipped)) {
    renderWeightInput(container);
    return;
  }

  // Main meal logging view
  renderMealDay(container, today);
}

function renderWeightInput(container) {
  const yesterday = getYesterdayWeight();
  container.innerHTML = `
    <div class="animate-in" style="padding-top:40px;text-align:center;">
      <div class="greeting">${getGreeting()}, the user</div>
      <div class="greeting-sub">${formatDate(todayKey)}</div>
      <div class="weight-input-wrap" style="margin-top:32px;">
        <label>Weight (lbs)</label>
        <input type="number" id="weight-input" class="weight-big" step="0.1" min="100" max="400"
               placeholder="225.0" inputmode="decimal">
        ${yesterday ? `<div class="yesterday-ref">Yesterday: ${yesterday} lbs</div>` : ''}
      </div>
      <button class="btn btn-primary btn-large" style="max-width:200px;margin:16px auto 0;"
              onclick="logWeight()">Log Weight</button>
      <div style="margin-top:12px;">
        <a href="#" onclick="event.preventDefault();skipWeight()"
           style="color:var(--text-muted);font-size:var(--font-size-sm);text-decoration:none;">
          Skip for today
        </a>
      </div>
    </div>
  `;
  setTimeout(() => document.getElementById('weight-input')?.focus(), 100);
}

async function logWeight() {
  const input = document.getElementById('weight-input');
  const val = parseFloat(input.value);
  if (!val || val < 100 || val > 400) {
    BrainKit.toast('Enter a valid weight', 'warning');
    return;
  }
  const today = ensureTodayExists();
  today.weight = val;
  today.weight_time = nowTime();
  await saveLog();
  BrainKit.toast('Weight logged', 'success');
  renderToday();
}

async function skipWeight() {
  const today = ensureTodayExists();
  today.weight_skipped = true;
  await saveLog();
  BrainKit.toast('Weight skipped', 'success');
  renderToday();
}

function renderMealDay(container, today) {
  const totals = getTodayTotals();
  const targets = mealPlan.daily_targets;
  const isComplete = today.end_of_day && today.end_of_day.feel;

  const calPct = Math.min(100, (totals.cal / targets.calories) * 100);
  const proPct = Math.min(100, (totals.protein / targets.protein) * 100);

  let html = '';

  // Greeting line
  html += `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-md);">
      <div>
        <div style="font-size:var(--font-size-lg);font-weight:700;">${getGreeting()}, the user</div>
        <div style="font-size:var(--font-size-sm);color:var(--text-muted);">${formatDate(todayKey)}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="openResetConfirm()">Reset Day</button>
    </div>
  `;

  // Macro bar
  html += `
    <div class="macro-bar">
      <div class="macro-item">
        <div class="macro-current">${totals.cal}</div>
        <div class="macro-target">/ ${targets.calories}</div>
        <div class="macro-label">calories</div>
        <div class="macro-progress"><div class="macro-progress-fill" style="width:${calPct}%;background:var(--accent);"></div></div>
      </div>
      <div class="macro-item">
        <div class="macro-current">${totals.protein}g</div>
        <div class="macro-target">/ ${targets.protein}g</div>
        <div class="macro-label">protein</div>
        <div class="macro-progress"><div class="macro-progress-fill" style="width:${proPct}%;background:var(--success);"></div></div>
      </div>
    </div>
  `;

  // Weight display
  if (today.weight) {
    html += `<div style="font-size:var(--font-size-sm);color:var(--text-muted);margin-bottom:var(--sp-md);text-align:center;">Weight: ${today.weight} lbs</div>`;
  }

  // Meal slot cards
  for (let s = 1; s <= 5; s++) {
    html += renderSlotCard(s, today);
  }

  // End of day / summary
  if (isComplete) {
    html += renderDaySummarySection(today);
    // "Log More Food" button after EOD
    html += `
      <button class="btn btn-secondary btn-large" style="margin-top:var(--sp-md);" onclick="reopenMealLogging()">
        Log More Food
      </button>
    `;
  } else {
    // Show end-of-day button
    html += `
      <div class="card" style="margin-top:var(--sp-md);">
        <div class="card-header">End of Day</div>
        <div class="feel-row">
          ${[1,2,3,4,5].map(n => `<div class="feel-btn" onclick="setFeel(${n})"><span class="feel-num">${n}</span>${['','Rough','Meh','Okay','Good','Great'][n]}</div>`).join('')}
        </div>
        <div style="margin-top:12px;">
          <label style="font-size:var(--font-size-sm);color:var(--text-muted);display:block;margin-bottom:6px;">Steps</label>
          <input type="number" id="eod-steps" placeholder="8000" inputmode="numeric" style="font-size:var(--font-size-md);text-align:left;padding:var(--sp-md);">
        </div>
        <div style="margin-top:12px;">
          <label style="font-size:var(--font-size-sm);color:var(--text-muted);display:block;margin-bottom:6px;">Notes</label>
          <textarea id="eod-notes" placeholder="How was the day?"></textarea>
        </div>
        <button class="btn btn-primary btn-large" style="margin-top:12px;" id="eod-submit" disabled
                onclick="submitEndOfDay()">Complete Day</button>
      </div>
    `;
  }

  container.innerHTML = html;
}

function renderSlotCard(slotNum, today) {
  const slotInfo = getSlotInfo(slotNum);
  if (!slotInfo) return '';

  const meals = getMealsForSlot(slotNum);
  // Check old custom meals too
  const oldCustom = (today.custom_meals || []).filter(m => m.slot === slotNum);
  const hasLogged = meals.length > 0 || oldCustom.length > 0;
  const isExpanded = expandedSlot === slotNum;
  const isDescribing = describingSlot === slotNum;
  const isAddingMore = addingToSlot === slotNum;

  let html = `<div class="slot-card${hasLogged ? ' logged' : ''}${isExpanded ? ' expanded' : ''}" id="slot-${slotNum}">`;

  // Header
  html += `<div class="slot-header" onclick="toggleSlot(${slotNum})">`;
  html += `<div class="slot-info">`;
  html += `<div><span class="slot-name">${slotInfo.name}</span><span class="slot-time">${slotInfo.time}</span></div>`;
  html += `<div class="slot-target">Target: ${slotInfo.cal_target} cal / ${slotInfo.protein_target}g P</div>`;
  html += `</div>`;

  if (isDescribing) {
    html += `<div class="slot-status" style="color:var(--accent);">Estimating...</div>`;
  } else if (hasLogged) {
    let slotCal = 0, slotPro = 0;
    meals.forEach(m => { if (m.totals) { slotCal += m.totals.cal; slotPro += m.totals.protein; } });
    oldCustom.forEach(cm => { slotCal += cm.total_cal || cm.cal || 0; slotPro += cm.total_protein || cm.protein || 0; });
    html += `<div class="slot-status"><span class="slot-check">&#10003;</span><span class="slot-logged-macros">${slotCal} cal / ${slotPro}g</span></div>`;
  } else {
    html += `<div class="slot-status">Tap to log</div>`;
  }
  html += `</div>`; // end header

  // Body (expanded content)
  html += `<div class="slot-body">`;

  // Show logged meals if any
  if (hasLogged) {
    for (const m of meals) {
      html += renderLoggedMeal(m, slotNum);
    }
    for (const cm of oldCustom) {
      html += renderOldCustomMeal(cm);
    }
    if (isDescribing) {
      html += `<div class="describe-loading"><span class="pulse-dot"></span><span>Coach is estimating macros...</span></div>`;
    } else if (isAddingMore) {
      html += renderLoggingInterface(slotNum);
    } else {
      html += `<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:var(--sp-sm);" onclick="openLoggingForSlot(${slotNum})">+ Add more to this meal</button>`;
    }
  } else if (isDescribing) {
    html += `<div class="describe-loading"><span class="pulse-dot"></span><span>Coach is estimating macros...</span></div>`;
  } else {
    // Logging interface
    html += renderLoggingInterface(slotNum);
  }

  html += `</div>`; // end body
  html += `</div>`; // end slot-card

  return html;
}

function renderLoggedMeal(meal, slotNum) {
  let html = `<div class="logged-meal-display">`;

  // Show items
  html += `<div class="logged-meal-items">`;
  if (meal.items && meal.items.length) {
    for (const it of meal.items) {
      const f = getFood(it.food);
      const name = f ? f.name : it.food;
      const unit = f ? f.unit : '';
      const m = calcItemMacros(it);
      html += `<div><span>${name} x${it.amount} ${unit}</span><span>${m.cal} cal</span></div>`;
    }
  }
  if (meal.description) {
    html += `<div style="font-style:italic;color:var(--text-muted);">${meal.description}</div>`;
  }
  html += `</div>`; // end items

  if (meal.totals) {
    html += `<div class="logged-meal-totals">
      <span>${meal.totals.cal} cal &middot; ${meal.totals.protein}g P &middot; ${meal.totals.fat}g F &middot; ${meal.totals.carb}g C</span>
      ${meal.time ? `<span style="color:var(--text-muted);">${meal.time}</span>` : ''}
    </div>`;
  }

  // Rating row
  const rUp = meal.rating === 'up' ? ' active-up' : '';
  const rDown = meal.rating === 'down' ? ' active-down' : '';
  const mealIdx = (getTodayData()?.meals || []).indexOf(meal);

  html += `<div class="meal-actions">
    <div class="rating-row">
      <button class="rating-btn${rUp}" onclick="event.stopPropagation();setMealRating(${mealIdx},'up')" title="Good meal">&#128077;</button>
      <button class="rating-btn${rDown}" onclick="event.stopPropagation();setMealRating(${mealIdx},'down')" title="Not great">&#128078;</button>
    </div>
    <button class="pin-btn${isPinnedMeal(slotNum, meal) ? ' pinned' : ''}" onclick="event.stopPropagation();togglePin(${slotNum},${mealIdx})" title="${isPinnedMeal(slotNum, meal) ? 'Unpin' : 'Pin for tomorrow'}">&#128204;</button>
    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();removeMeal(${mealIdx})" style="color:var(--text-muted);">Remove</button>
  </div>`;

  // Show rating note input if thumbs down
  if (meal.rating === 'down') {
    html += `<input class="rating-note-input" placeholder="What was wrong? (optional)"
              value="${meal.rating_note || ''}"
              onchange="setMealRatingNote(${mealIdx}, this.value)"
              onclick="event.stopPropagation()">`;
  }

  html += `</div>`; // end logged-meal-display
  return html;
}

function renderOldCustomMeal(cm) {
  const cal = cm.total_cal || cm.estimated_cal || cm.cal || 0;
  const pro = cm.total_protein || cm.estimated_protein || cm.protein || 0;
  const label = cm.items ? (typeof cm.items[0] === 'string' ? cm.items.join(', ') : cm.items.map(i => i.name).join(', ')) : cm.description || 'Custom';
  return `<div class="logged-meal-display">
    <div class="logged-meal-items"><div style="font-style:italic;">${label}</div></div>
    <div class="logged-meal-totals"><span>~${cal} cal &middot; ~${pro}g P</span></div>
  </div>`;
}

function renderLoggingInterface(slotNum) {
  const pinned = getPinnedMealForSlot(slotNum);
  const premades = getPremadeMealsForSlot(slotNum);

  let html = '';

  // Pinned meal banner
  if (pinned) {
    const totals = calcItemsTotals(pinned);
    html += `<div class="pinned-banner">
      <div class="pinned-banner-title">&#128204; Pinned from last time</div>
      <div style="font-size:var(--font-size-sm);color:var(--text-secondary);">`;
    for (const it of pinned) {
      const f = getFood(it.food);
      html += `${f ? f.name : it.food} x${it.amount}${f ? ' ' + f.unit : ''}<br>`;
    }
    html += `</div>
      <div style="font-size:var(--font-size-sm);font-weight:600;margin-top:4px;">${totals.cal} cal &middot; ${totals.protein}g P</div>
      <div class="pinned-banner-actions">
        <button class="btn btn-success btn-sm" onclick="event.stopPropagation();confirmPinnedMeal(${slotNum})">Confirm</button>
        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();editPinnedMeal(${slotNum})">Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();unpinSlot(${slotNum})">Unpin</button>
      </div>
    </div>`;
  }

  // Mode tabs
  html += `<div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode(${slotNum}, 'premade', this)">Pre-made</button>
    <button class="mode-tab" onclick="switchMode(${slotNum}, 'build', this)">Build</button>
    <button class="mode-tab" onclick="switchMode(${slotNum}, 'describe', this)">Describe</button>
  </div>`;

  // Pre-made mode
  html += `<div class="mode-content active" id="mode-premade-${slotNum}">`;
  if (premades.length === 0) {
    html += `<div style="text-align:center;padding:var(--sp-lg);color:var(--text-muted);font-size:var(--font-size-sm);">No pre-made meals for this slot</div>`;
  }
  for (const pm of premades) {
    const totals = calcItemsTotals(pm.items);
    html += `<div class="premade-card" onclick="event.stopPropagation();loadPremadeIntoBuild(${slotNum}, '${pm.id}')">
      <div class="premade-name">${pm.name}</div>
      <div class="premade-macros">${totals.cal} cal &middot; ${totals.protein}g P &middot; ${totals.fat}g F &middot; ${totals.carb}g C</div>
      <div style="font-size:var(--font-size-xs);color:var(--text-muted);margin-top:4px;">
        ${pm.items.map(it => { const f = getFood(it.food); return (f ? f.name : it.food) + ' x' + it.amount; }).join(', ')}
      </div>
    </div>`;
  }
  html += `</div>`;

  // Build mode
  html += `<div class="mode-content" id="mode-build-${slotNum}">`;
  html += renderBuildMode(slotNum);
  html += `</div>`;

  // Describe mode
  html += `<div class="mode-content" id="mode-describe-${slotNum}">`;
  html += `<div class="describe-area">
    <textarea id="describe-text-${slotNum}" placeholder="Describe what you ate (e.g., Whataburger patty melt with fries)" style="margin-bottom:var(--sp-sm);"></textarea>
    <button class="btn btn-primary" style="width:100%;" onclick="event.stopPropagation();submitDescribeMeal(${slotNum})">Send to Coach</button>
  </div>`;
  html += `</div>`;

  return html;
}

function renderBuildMode(slotNum) {
  const slotInfo = getSlotInfo(slotNum);
  const totals = calcItemsTotals(buildItems);

  let html = '';

  // Running total
  html += `<div class="build-running-total" id="build-total-${slotNum}">
    <span>Building: ${totals.cal} cal / ${totals.protein}g P</span>
    <span style="font-size:var(--font-size-xs);color:var(--text-muted);">Target: ${slotInfo ? slotInfo.cal_target : '?'}</span>
  </div>`;

  // Current build items
  html += `<div class="build-items" id="build-items-${slotNum}">`;
  for (let i = 0; i < buildItems.length; i++) {
    const it = buildItems[i];
    const f = getFood(it.food);
    if (!f) continue;
    const m = calcItemMacros(it);
    html += `<div class="build-item">
      <span class="build-item-name">${f.name}</span>
      <input type="number" class="build-item-qty" value="${it.amount}" step="0.5" min="0.5"
             onchange="updateBuildAmount(${i}, this.value)" onclick="event.stopPropagation();this.select()" inputmode="decimal">
      <span class="build-item-unit">${f.unit}</span>
      <span class="build-item-cals">${m.cal} cal</span>
      <button class="build-item-remove" onclick="event.stopPropagation();removeBuildItem(${i})">&#10005;</button>
    </div>`;
  }
  html += `</div>`;

  // Log button
  if (buildItems.length > 0) {
    html += `<button class="btn btn-success" style="width:100%;margin-bottom:var(--sp-md);"
              onclick="event.stopPropagation();logBuiltMeal(${slotNum})">Log Meal (${totals.cal} cal)</button>`;
  }

  // Ingredient picker
  html += renderIngredientPicker(slotNum);

  return html;
}

function renderIngredientPicker(slotNum) {
  if (!foods.foods) return '';
  const categories = ['protein', 'carb', 'fat'];
  const labels = { protein: 'Protein', carb: 'Carb', fat: 'Fat' };
  let html = '';

  for (const cat of categories) {
    const items = Object.entries(foods.foods).filter(([k, v]) => v.category === cat);
    if (items.length === 0) continue;

    html += `<div class="ing-section" id="ing-${cat}-${slotNum}">`;
    html += `<div class="ing-section-header" onclick="event.stopPropagation();toggleIngSection('ing-${cat}-${slotNum}')">
      <span class="arrow">&#9654;</span>
      <span>${labels[cat]} (${items.length})</span>
    </div>`;
    html += `<div class="ing-section-body">`;
    for (const [key, f] of items) {
      html += `<div class="ing-item" onclick="event.stopPropagation();addToBuild('${key}', ${slotNum})">
        <span class="ing-item-name">${f.name}</span>
        <span class="ing-item-meta">${f.cal} cal/${f.unit} &middot; ${f.protein}g P</span>
        <span class="ing-item-add">+</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  return html;
}

// ============================================================
// SLOT / MODE INTERACTION
// ============================================================
function toggleSlot(slotNum) {
  if (expandedSlot === slotNum) {
    expandedSlot = null;
    addingToSlot = null;
    buildItems = [];
  } else {
    expandedSlot = slotNum;
    addingToSlot = null;
    buildItems = []; // Reset build items when opening a new slot
  }
  renderToday();
}

function openLoggingForSlot(slotNum) {
  expandedSlot = slotNum;
  addingToSlot = slotNum;
  buildItems = [];
  renderToday();
}

function switchMode(slotNum, mode, btn) {
  // Update tab buttons
  const tabs = btn.parentElement.querySelectorAll('.mode-tab');
  tabs.forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  // Update content
  const parent = btn.closest('.slot-body');
  if (!parent) return;
  parent.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
  const target = parent.querySelector('#mode-' + mode + '-' + slotNum);
  if (target) target.classList.add('active');

  // If switching to build, reset items
  if (mode === 'build') {
    buildItems = [];
    refreshBuildUI(slotNum);
  }
}

function toggleIngSection(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ============================================================
// BUILD MODE ACTIONS
// ============================================================
function addToBuild(foodKey, slotNum) {
  const existing = buildItems.find(it => it.food === foodKey);
  if (existing) {
    existing.amount += 1;
  } else {
    buildItems.push({ food: foodKey, amount: 1 });
  }
  refreshBuildUI(slotNum);
}

function updateBuildAmount(idx, val) {
  const num = parseFloat(val);
  if (!num || num <= 0) return;
  buildItems[idx].amount = num;
  // Update total display without full re-render
  const slotNum = expandedSlot;
  if (slotNum) refreshBuildUI(slotNum);
}

function removeBuildItem(idx) {
  buildItems.splice(idx, 1);
  const slotNum = expandedSlot;
  if (slotNum) refreshBuildUI(slotNum);
}

function refreshBuildUI(slotNum) {
  const buildContainer = document.getElementById('mode-build-' + slotNum);
  if (buildContainer) {
    buildContainer.innerHTML = renderBuildMode(slotNum);
  }
}

async function logBuiltMeal(slotNum) {
  if (buildItems.length === 0) return;

  const today = ensureTodayExists();
  const totals = calcItemsTotals(buildItems);

  const entry = {
    slot: slotNum,
    type: 'built',
    items: JSON.parse(JSON.stringify(buildItems)),
    totals: totals,
    time: nowTime(),
    rating: null,
    rating_note: null
  };

  today.meals.push(entry);
  buildItems = [];
  expandedSlot = null;
  addingToSlot = null;

  await saveLog();
  BrainKit.toast(`Logged: ${totals.cal} cal / ${totals.protein}g P`, 'success');
  renderToday();
}

// ============================================================
// PREMADE MEALS
// ============================================================
function loadPremadeIntoBuild(slotNum, premadeId) {
  const premades = getPremadeMealsForSlot(slotNum);
  const pm = premades.find(p => p.id === premadeId);
  if (!pm) return;

  // Load items into build mode
  buildItems = pm.items.map(it => ({ food: it.food, amount: it.amount }));

  // Switch to build mode
  const slotBody = document.querySelector(`#slot-${slotNum} .slot-body`);
  if (slotBody) {
    const tabs = slotBody.querySelectorAll('.mode-tab');
    tabs.forEach(t => t.classList.remove('active'));
    if (tabs[1]) tabs[1].classList.add('active');

    slotBody.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
    const buildContent = slotBody.querySelector('#mode-build-' + slotNum);
    if (buildContent) {
      buildContent.classList.add('active');
      buildContent.innerHTML = renderBuildMode(slotNum);
    }
  }
}

// ============================================================
// PINNED MEALS
// ============================================================
function isPinnedMeal(slotNum, meal) {
  const pinned = getPinnedMealForSlot(slotNum);
  if (!pinned || !meal.items) return false;
  // Simple check: same items and amounts
  if (pinned.length !== meal.items.length) return false;
  return pinned.every((p, i) => meal.items[i] && p.food === meal.items[i].food && p.amount === meal.items[i].amount);
}

async function togglePin(slotNum, mealIdx) {
  const today = getTodayData();
  if (!today || !today.meals[mealIdx]) return;
  const meal = today.meals[mealIdx];
  if (!meal.items || meal.items.length === 0) return;

  if (isPinnedMeal(slotNum, meal)) {
    // Unpin
    delete pinnedMeals[String(slotNum)];
    BrainKit.toast('Unpinned', 'success');
  } else {
    // Pin
    pinnedMeals[String(slotNum)] = meal.items.map(it => ({ food: it.food, amount: it.amount }));
    BrainKit.toast('Pinned for tomorrow', 'success');
  }
  await savePinnedMeals();
  renderToday();
}

async function confirmPinnedMeal(slotNum) {
  const pinned = getPinnedMealForSlot(slotNum);
  if (!pinned) return;

  const today = ensureTodayExists();
  const totals = calcItemsTotals(pinned);

  const entry = {
    slot: slotNum,
    type: 'built',
    items: JSON.parse(JSON.stringify(pinned)),
    totals: totals,
    time: nowTime(),
    rating: null,
    rating_note: null
  };

  today.meals.push(entry);
  expandedSlot = null;
  addingToSlot = null;

  await saveLog();
  BrainKit.toast(`Logged: ${totals.cal} cal / ${totals.protein}g P`, 'success');
  renderToday();
}

function editPinnedMeal(slotNum) {
  const pinned = getPinnedMealForSlot(slotNum);
  if (!pinned) return;

  // Load pinned items into build mode
  buildItems = pinned.map(it => ({ food: it.food, amount: it.amount }));

  // Switch to build mode
  const slotBody = document.querySelector(`#slot-${slotNum} .slot-body`);
  if (slotBody) {
    const tabs = slotBody.querySelectorAll('.mode-tab');
    tabs.forEach(t => t.classList.remove('active'));
    if (tabs[1]) tabs[1].classList.add('active');

    slotBody.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
    const buildContent = slotBody.querySelector('#mode-build-' + slotNum);
    if (buildContent) {
      buildContent.classList.add('active');
      buildContent.innerHTML = renderBuildMode(slotNum);
    }
  }
}

async function unpinSlot(slotNum) {
  delete pinnedMeals[String(slotNum)];
  await savePinnedMeals();
  BrainKit.toast('Unpinned', 'success');
  renderToday();
}

// ============================================================
// DESCRIBE MODE
// ============================================================
async function submitDescribeMeal(slotNum) {
  const textarea = document.getElementById('describe-text-' + slotNum);
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!text) { BrainKit.toast('Describe what you ate', 'warning'); return; }

  const slotInfo = getSlotInfo(slotNum);
  describingSlot = slotNum;
  renderToday();

  try {
    await BrainKit.askAgent('nutrition_coach',
      `This message is from the user, sent from the diet tracker app. He's telling you what he ate for ${slotInfo?.name || 'Meal ' + slotNum} on ${todayKey}:

"${text}"

Use your full brain and toolset to figure out how to log this properly. You are his coach — you know him. Don't just guess a generic estimate.

BEFORE estimating, think about whether the user is referencing something you should already know:
- Phrases like "my classic X", "the usual", "I always get", "you know the deal", "same as last time" mean there IS a prior log. FIND IT.
- Search your memory (memory_search) — you have entries on his standard orders (Subway, Whataburger, Lisa's, etc).
- Grep the daily log at 05_App_Data/diet/daily_log.json for similar past entries and match the macros from those. Past the user has already done this math — reuse it.
- Check meal_plan.json for pinned/built meals that might match.

Only fall back to USDA/generic estimation if there's genuinely no prior reference for this food.

When you have the answer, write it as JSON to 05_App_Data/diet/_estimate.json. Write ONLY the JSON — no prose, no markdown, no code fences:

{
  "cal": number,
  "protein": number,
  "fat": number,
  "carb": number,
  "items": [{"name": "Item name", "cal": number, "protein": number}]
}

Round calories to nearest 5, protein to nearest 1g. Match portions to what the user actually described — not a default serving.`
    );

    const resultStr = await BrainKit.readFile('diet/_estimate.json');
    const result = JSON.parse(resultStr);

    const today = ensureTodayExists();
    const entry = {
      slot: slotNum,
      type: 'described',
      description: text,
      totals: {
        cal: result.cal || 0,
        protein: result.protein || 0,
        fat: result.fat || 0,
        carb: result.carb || 0
      },
      time: nowTime(),
      rating: null,
      rating_note: null
    };
    if (result.items) entry.estimated_items = result.items;

    today.meals.push(entry);
    await saveLog();
    BrainKit.toast(`Logged: ~${entry.totals.cal} cal / ${entry.totals.protein}g P`, 'success');
  } catch (e) {
    console.error('Describe meal failed:', e);
    BrainKit.toast('Failed to estimate — try again?', 'error');
  } finally {
    describingSlot = null;
    expandedSlot = null;
    addingToSlot = null;
    renderToday();
  }
}

// RATINGS
// ============================================================
async function setMealRating(mealIdx, rating) {
  const today = getTodayData();
  if (!today || !today.meals[mealIdx]) return;
  const meal = today.meals[mealIdx];

  if (meal.rating === rating) {
    meal.rating = null;
    meal.rating_note = null;
  } else {
    meal.rating = rating;
    if (rating !== 'down') meal.rating_note = null;
  }

  await saveLog();
  renderToday();
}

async function setMealRatingNote(mealIdx, note) {
  const today = getTodayData();
  if (!today || !today.meals[mealIdx]) return;
  today.meals[mealIdx].rating_note = note;
  await saveLog();
}

// ============================================================
// MEAL REMOVAL
// ============================================================
async function removeMeal(mealIdx) {
  const today = getTodayData();
  if (!today || !today.meals[mealIdx]) return;
  today.meals.splice(mealIdx, 1);
  await saveLog();
  renderToday();
}

function reopenMealLogging() {
  const today = getTodayData();
  if (!today) return;

  buildItems = [];

// ============================================================
// TAB: PROGRESS
// ============================================================
function renderProgress() {
  const container = document.getElementById('progress-content');
  const dates = Object.keys(dailyLog).sort();
  const weights = dates.filter(d => dailyLog[d].weight).map(d => ({ date: d, weight: dailyLog[d].weight }));

  if (weights.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No data yet. Log your first weight on the Today tab.</div>';
    return;
  }

  // EWMA calculation
  const alpha = 2 / (7 + 1);
  let ewma = [weights[0].weight];
  for (let i = 1; i < weights.length; i++) {
    ewma.push(alpha * weights[i].weight + (1 - alpha) * ewma[i - 1]);
  }

  const currentWeight = weights[weights.length - 1].weight;
  const startWeight = weights[0].weight;
  const totalLost = (startWeight - currentWeight).toFixed(1);
  const daysTracked = weights.length;
  const startDate = mealPlan?.start_date || dates[0];
  const daysSinceStart = Math.max(1, Math.ceil((new Date() - new Date(startDate)) / 86400000));

  // Weekly average
  const last7 = dates.slice(-7);
  let weekCal = 0, weekPro = 0, weekDays = 0;
  for (const d of last7) {
    const t = getDayTotals(dailyLog[d]);
    if (t.cal > 0) { weekCal += t.cal; weekPro += t.protein; weekDays++; }
  }
  const avgCal = weekDays ? Math.round(weekCal / weekDays) : 0;
  const avgPro = weekDays ? Math.round(weekPro / weekDays) : 0;

  let tdeeHtml = '';
  if (daysTracked >= 21 && weekDays > 0) {
    const weightChange = startWeight - currentWeight;
    const tdee = Math.round(avgCal + (weightChange * 3500 / daysTracked));
    tdeeHtml = `<div class="stat-badge"><div class="stat-value">${tdee}</div><div class="stat-label">Est. TDEE</div></div>`;
  }

  container.innerHTML = `
    <div style="margin-bottom:var(--sp-lg);">
      <div style="font-size:var(--font-size-xl);font-weight:700;margin-bottom:4px;">Progress</div>
      <div style="font-size:var(--font-size-sm);color:var(--text-muted);">Weight trend over time</div>
    </div>
    <div class="chart-container"><canvas id="weight-chart" height="220"></canvas></div>
    <div class="stat-row">
      <div class="stat-badge"><div class="stat-value">${currentWeight}</div><div class="stat-label">Current (lbs)</div></div>
      <div class="stat-badge"><div class="stat-value">${startWeight}</div><div class="stat-label">Start (lbs)</div></div>
      <div class="stat-badge"><div class="stat-value">${totalLost}</div><div class="stat-label">Lost (lbs)</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-badge"><div class="stat-value">${avgCal}</div><div class="stat-label">Avg Cal (7d)</div></div>
      <div class="stat-badge"><div class="stat-value">${avgPro}g</div><div class="stat-label">Avg Protein (7d)</div></div>
      <div class="stat-badge"><div class="stat-value">${daysTracked}</div><div class="stat-label">Days Tracked</div></div>
      ${tdeeHtml}
    </div>
    <div style="margin-top:20px;">
      <div style="font-size:var(--font-size-md);font-weight:700;margin-bottom:10px;">Weekly Breakdown</div>
      <div id="weekly-breakdown"></div>
    </div>
  `;

  renderWeightChart(weights, ewma);
  renderWeeklyBreakdown(dates);
}

function renderWeightChart(weights, ewma) {
  const ctx = document.getElementById('weight-chart');
  if (!ctx) return;
  if (weightChart) { weightChart.destroy(); weightChart = null; }

  const labels = weights.map(w => {
    const d = new Date(w.date + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  });

  const accentColor = cssVar('--accent');
  const mutedColor = cssVar('--text-muted');
  const borderClr = cssVar('--border');

  weightChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Weight',
          data: weights.map(w => w.weight),
          borderColor: mutedColor, backgroundColor: 'transparent', borderWidth: 1.5,
          pointRadius: 4, pointBackgroundColor: accentColor, pointBorderColor: accentColor,
          tension: 0, fill: false
        },
        {
          label: 'Trend (7d EWMA)',
          data: ewma,
          borderColor: accentColor, borderWidth: 3, pointRadius: 0,
          tension: 0.3, fill: false
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { color: mutedColor, font: { size: 11 }, boxWidth: 12, padding: 12 } },
        tooltip: {
          backgroundColor: cssVar('--bg-surface'), titleColor: cssVar('--text'),
          bodyColor: cssVar('--text-secondary'), borderColor: borderClr, borderWidth: 1,
          cornerRadius: 8, padding: 10
        }
      },
      scales: {
        x: { ticks: { color: mutedColor, font: { size: 10 } }, grid: { color: borderClr + '4D' } },
        y: {
          ticks: { color: mutedColor, font: { size: 10 } }, grid: { color: borderClr + '4D' },
          suggestedMin: Math.min(...weights.map(w => w.weight)) - 2,
          suggestedMax: Math.max(...weights.map(w => w.weight)) + 2
        }
      }
    }
  });
}

function renderWeeklyBreakdown(dates) {
  const el = document.getElementById('weekly-breakdown');
  if (!el) return;

  const weeks = {};
  for (const d of dates) {
    const date = new Date(d + 'T12:00:00');
    const day = date.getDay();
    const monday = new Date(date);
    monday.setDate(date.getDate() - ((day + 6) % 7));
    const weekKey = monday.toISOString().split('T')[0];
    if (!weeks[weekKey]) weeks[weekKey] = [];
    weeks[weekKey].push(d);
  }

  const weekKeys = Object.keys(weeks).sort().reverse();
  let html = '';
  for (const wk of weekKeys) {
    const days = weeks[wk];
    const weekWeights = days.filter(d => dailyLog[d].weight).map(d => dailyLog[d].weight);
    const avgWeight = weekWeights.length ? (weekWeights.reduce((a,b)=>a+b,0) / weekWeights.length).toFixed(1) : '—';
    let totalCal = 0, totalPro = 0, mealDays = 0;
    for (const d of days) {
      const t = getDayTotals(dailyLog[d]);
      if (t.cal > 0) { totalCal += t.cal; totalPro += t.protein; mealDays++; }
    }
    const avgCal = mealDays ? Math.round(totalCal / mealDays) : 0;

    html += `<div class="accordion">
      <div class="accordion-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open');">
        <span>Week of ${formatDate(wk)}</span>
        <span style="font-size:var(--font-size-sm);color:var(--text-muted);">Avg: ${avgWeight} lbs &middot; ${avgCal} cal</span>
      </div>
      <div class="accordion-body">`;

    for (const d of days.sort()) {
      const day = dailyLog[d];
      const t = getDayTotals(day);
      const feelLabels = ['', 'Rough', 'Meh', 'Okay', 'Good', 'Great'];
      const feel = day.end_of_day?.feel ? feelLabels[day.end_of_day.feel] : '—';
      html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
        <span>${formatDate(d)}</span>
        <span style="color:var(--text-muted);">${day.weight || '—'} lbs &middot; ${t.cal} cal &middot; ${t.protein}g &middot; ${feel}</span>
      </div>`;
    }
    html += '</div></div>';
  }

  el.innerHTML = html || '<div style="color:var(--text-muted);font-size:var(--font-size-base);">No weeks to show yet.</div>';
}

// TAB: MEALS (Database & Pre-mades reference)
// ============================================================
function renderMeals() {
  const container = document.getElementById('meals-content');
  let html = '';

  // Header with add button
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-lg);">
    <div style="font-size:var(--font-size-xl);font-weight:700;">Meals</div>
    <button class="btn btn-primary btn-sm" onclick="openAddIngredientModal()">+ Add Ingredient</button>
  </div>`;

  // Ingredient Database
  html += `<div style="font-size:var(--font-size-lg);font-weight:700;margin-bottom:var(--sp-md);">Ingredient Database</div>`;
  const categories = ['protein', 'carb', 'fat'];
  const catLabels = { protein: 'Protein', carb: 'Carb', fat: 'Fat' };

  for (const cat of categories) {
    const items = Object.entries(foods.foods || {}).filter(([k, v]) => v.category === cat);
    if (items.length === 0) continue;

    html += `<div class="db-section">
      <div class="db-section-header">${catLabels[cat]} (${items.length})</div>`;
    for (const [key, f] of items) {
      html += `<div class="db-item">
        <span class="db-item-name">${f.name}</span>
        <span class="db-item-macros">${f.cal} cal / ${f.protein}g P / ${f.fat}g F / ${f.carb}g C per ${f.unit}</span>
      </div>`;
    }
    html += `</div>`;
  }

  // Pre-made meals by slot
  if (mealPlan && mealPlan.premade_meals) {
    html += `<div style="font-size:var(--font-size-lg);font-weight:700;margin:var(--sp-2xl) 0 var(--sp-md);">Pre-made Meals</div>`;

    for (const slot of (mealPlan.slots || [])) {
      const premades = getPremadeMealsForSlot(slot.slot);
      if (premades.length === 0) continue;

      html += `<div class="browse-slot">
        <div class="browse-slot-header">${slot.name}</div>
        <div class="browse-slot-sub">${slot.time} &middot; ${slot.cal_target} cal / ${slot.protein_target}g protein</div>`;

      for (const pm of premades) {
        const totals = calcItemsTotals(pm.items);
        html += `<div class="browse-meal" onclick="this.querySelector('.browse-meal-items').classList.toggle('open')">
          <div class="browse-meal-header">
            <span class="browse-meal-name">${pm.name}</span>
            <span class="browse-meal-macros">${totals.cal} cal / ${totals.protein}g P</span>
          </div>
          <div class="browse-meal-items">
            ${pm.items.map(it => {
              const f = getFood(it.food);
              const m = calcItemMacros(it);
              return `<div style="display:flex;justify-content:space-between;padding:3px 0;">
                <span>${f ? f.name : it.food} x${it.amount} ${f ? f.unit : ''}</span>
                <span style="color:var(--text-muted);">${m.cal} cal &middot; ${m.protein}g P</span>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }
      html += `</div>`;
    }
  }

  container.innerHTML = html;
}

// Add Ingredient Modal
function openAddIngredientModal() {
  document.getElementById('add-ingredient-modal').classList.add('open');
  // Clear form
  ['new-ing-name','new-ing-unit','new-ing-cal','new-ing-protein','new-ing-fat','new-ing-carb'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('new-ing-category').value = 'protein';
}

function closeAddIngredientModal() {
  document.getElementById('add-ingredient-modal').classList.remove('open');
}

async function saveNewIngredient() {
  const name = document.getElementById('new-ing-name').value.trim();
  const category = document.getElementById('new-ing-category').value;
  const unit = document.getElementById('new-ing-unit').value.trim();
  const cal = parseFloat(document.getElementById('new-ing-cal').value) || 0;
  const protein = parseFloat(document.getElementById('new-ing-protein').value) || 0;
  const fat = parseFloat(document.getElementById('new-ing-fat').value) || 0;
  const carb = parseFloat(document.getElementById('new-ing-carb').value) || 0;

  if (!name || !unit) {
    BrainKit.toast('Name and unit are required', 'warning');
    return;
  }

  // Generate key
  const key = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  if (foods.foods[key]) {
    BrainKit.toast('An ingredient with that key already exists', 'warning');
    return;
  }

  foods.foods[key] = { name, category, unit, cal, protein, fat, carb };
  await saveFoods();
  closeAddIngredientModal();
  BrainKit.toast(`Added ${name}`, 'success');
  renderMeals();
}

function renderHistory() {
  const container = document.getElementById('history-content');
  const dates = Object.keys(dailyLog).sort().reverse();

  if (dates.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No history yet.</div>';
    return;
  }

  let html = '<div style="font-size:var(--font-size-xl);font-weight:700;margin-bottom:var(--sp-lg);">History</div>';

  for (const d of dates) {
    const day = dailyLog[d];
    const totals = getDayTotals(day);
    const feelLabels = ['', 'Rough', 'Meh', 'Okay', 'Good', 'Great'];
    const feel = day.end_of_day?.feel || 0;

    html += `<div class="history-day" onclick="this.querySelector('.history-day-detail').classList.toggle('open')">
      <div class="history-day-header">
        <span class="history-day-date">${formatDate(d)}</span>
        <span class="history-day-weight">${day.weight ? day.weight + ' lbs' : '—'}</span>
      </div>
      <div class="history-day-macros">${totals.cal} cal &middot; ${totals.protein}g protein${feel ? ' &middot; ' + feelLabels[feel] : ''}</div>
      <div class="history-day-detail">`;

    // New format meals
    if (day.meals && Array.isArray(day.meals)) {
      for (const m of day.meals) {
        if (m.totals) {
          // New format
          const slotInfo = getSlotInfo(m.slot);
          const slotName = slotInfo ? slotInfo.name : 'Meal ' + m.slot;
          let label = '';
          if (m.type === 'described' && m.description) {
            label = m.description;
          } else if (m.items && m.items.length) {
            label = m.items.map(it => { const f = getFood(it.food); return (f ? f.name : it.food) + ' x' + it.amount; }).join(', ');
          } else {
            label = m.type || 'Logged';
          }
          const ratingEmoji = m.rating === 'up' ? ' &#128077;' : m.rating === 'down' ? ' &#128078;' : '';
          html += `<div class="history-meal-line">
            <span>${slotName}: ${label}${ratingEmoji}</span>
            <span style="color:var(--text-muted);">${m.totals.cal} cal / ${m.totals.protein}g</span>
          </div>`;
          if (m.rating === 'down' && m.rating_note) {
            html += `<div style="font-size:var(--font-size-xs);color:var(--text-muted);font-style:italic;padding-left:var(--sp-md);">"${m.rating_note}"</div>`;
          }
        } else if (m.option_id) {
          // Old format — resolve label and macros
          const opt = getOldOptionById(m.option_id);
          const label = opt ? opt.label : m.option_id;
          const macroText = opt ? `${opt.total_cal} cal / ${opt.total_protein}g` : '—';
          html += `<div class="history-meal-line">
            <span>Meal ${m.slot}: ${label}</span>
            <span style="color:var(--text-muted);">${macroText}</span>
          </div>`;
        } else if (m.library_id) {
          // Old library format — resolve label and macros
          const lib = getOldOptionById(m.library_id);
          const label = lib ? lib.label : m.library_id;
          const macroText = lib ? `${lib.total_cal} cal / ${lib.total_protein}g` : '—';
          html += `<div class="history-meal-line">
            <span>Meal ${m.slot}: ${label}</span>
            <span style="color:var(--text-muted);">${macroText}</span>
          </div>`;
        } else if (m.skipped) {
          html += `<div class="history-meal-line">
            <span>Meal ${m.slot}: Skipped</span>
            <span style="color:var(--text-muted);">0 cal</span>
          </div>`;
        }
      }
    }

    // Old format custom meals
    if (day.custom_meals && Array.isArray(day.custom_meals)) {
      for (const cm of day.custom_meals) {
        const cal = cm.total_cal || cm.estimated_cal || cm.cal || 0;
        const pro = cm.total_protein || cm.estimated_protein || cm.protein || 0;
        const label = cm.items ? (typeof cm.items[0] === 'string' ? cm.items.join(', ') : cm.items.map(i => i.name).join(', ')) : cm.description || 'Custom';
        html += `<div class="history-meal-line">
          <span>Meal ${cm.slot}: ${label}</span>
          <span style="color:var(--text-muted);">~${cal} cal / ${pro}g</span>
        </div>`;
      }
    }

    if (day.end_of_day) {
      if (day.end_of_day.steps) html += `<div style="margin-top:6px;color:var(--text-muted);font-size:var(--font-size-sm);">Steps: ${day.end_of_day.steps.toLocaleString()}</div>`;
      if (day.end_of_day.notes) html += `<div style="margin-top:4px;font-style:italic;color:var(--text-muted);font-size:var(--font-size-sm);">"${day.end_of_day.notes}"</div>`;
    }

    html += '</div></div>';
  }

  container.innerHTML = html;
}

  }, 60000);
